### 新建索引的模板配置。
###
### 用法：把整个 index-template 文件夹复制成你自己的索引目录，然后在里面
### 建一个 input/ 放数据、放一份 .env 填密钥。通常只需要改两处：
###
###   1. input_storage.base_dir  —— 你的数据在哪个文件夹（默认 "input"）
###   2. .env 里的 GRAPHRAG_API_KEY —— 你自己的 DeepSeek 密钥
###
### 注意：所有相对路径都以本文件所在目录为基准（graphrag 会把工作目录切到这里），
### 所以 output/、lancedb/、cache/、logs/ 都会生成在这个目录里面。

### LLM settings ###

completion_models:
  default_completion_model:
    model_provider: openai
    model: deepseek-v4-flash
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    api_base: ${GRAPHRAG_API_BASE}
    call_args:
      max_tokens: 4000
      extra_body:
        thinking:
          type: disabled
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: ${GRAPHRAG_EMBEDDING_MODEL}
    auth_method: api_key
    api_key: local-embedding
    api_base: ${GRAPHRAG_EMBEDDING_ENDPOINT}
    retry:
      type: exponential_backoff

# 本地 Qwen 服务按 CPU 串行处理，避免多个大批次抢同一台机器的资源。
concurrent_requests: 1

### Document processing settings ###

input:
  type: jsonl
  id_column: id
  title_column: title
  text_column: text

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###

input_storage:
  type: file
  base_dir: "input"          # ← 改这里：你的 jsonl 放在哪个文件夹

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: lancedb

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model
  batch_size: 4
  batch_max_tokens: 2048

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [organization,person,project,event,topic]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 50

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
